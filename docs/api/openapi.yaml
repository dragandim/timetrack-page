  parameters:
    user-id:
      name: userId
      in: path
      required: true
      description: The ID of the user
      schema:
        type: string
    api-key-id:
      name: apiKeyId
      in: path
      required: true
      description: The ID of the api key
      schema:
        type: string
    task-id:
      name: taskId
      in: path
      required: true
      description: The ID of the task
      schema:
        type: string
    limit:
      name: limit
      in: query
      description: Maximum number of users to include in the summary.
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    last-key:
      name: lastKey
      in: query
      description: Pagination token to fetch the next set of results.
      required: false
      schema:
        type: string
    project-id:
      name: projectId
      in: path
      required: true
      description: ID of the Project
      schema:
        type: string
    metrics-index-day:
      name: index
      in: path
      required: true
      schema:
        type: integer
        minimum: 0
      description: |
        Number of days ago to query. Use `0` for today, `1` for yesterday, etc.
    metrics-index-week:
      name: index
      in: path
      required: true
      schema:
        type: integer
        minimum: 0
      description: |
        Number of weeks ago to query. Use `1` for the current week, `2` for the previous week, `3` for two weeks ago, etc.
    metrics-index-month:
      name: index
      in: path
      required: true
      schema:
        type: integer
        minimum: 0
      description: |
        Number of months ago to query. Use `1` for the current month, `2` for the previous month, `3` for two months ago, etc.
    start-date:
      name: startDate
      in: query
      description: |
        Start of the time range (inclusive), in UNIX milliseconds.
        The range between startDate and endDate must not exceed 7 days.
      required: false
      schema:
        type: integer
        example: 1714521600000
    end-date:
      name: endDate
      in: query
      description: |
        End of the time range (inclusive), in UNIX milliseconds.
        The range between startDate and endDate must not exceed 7 days.
      required: false
      schema:
        type: integer
        example: 1715039999999
    task-name:
      name: name
      in: path
      required: true
      description: Name of the task to clock in
      schema:
        type: string
        example: Write API Documentation
    task-externalid:
      name: externalid
      in: path
      required: true
      description: The external ID of the task to clock in
      schema:
        type: string
        example: JIRA-492
    timetrack-id:
      name: trackId
      in: path
      required: true
      description: The ID of the TimeTrack
      schema:
        type: string
    invitation-id:
      name: invId
      in: path
      required: true
      description: The unique ID of the invitation
      schema:
        type: string
        example: QEFf93fjap
    org-id:
      name: orgId
      in: path
      required: true
      description: The ID of the organisation
      schema:
        type: string
        example: Os2fe92ja9EA
