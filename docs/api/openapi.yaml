        '500':
          $ref: '#/components/responses/server-error'
    put:
      summary: Update organisation by ID
      operationId: updateOrganisation
      description: Updates an organisation's details.
      security:
        - bearerAuth: []
      tags:
        - Organisation
      parameters:
        - $ref: '#/components/parameters/org-id'
      requestBody:
        $ref: '#/components/requestBodies/org-update'
      responses:
        '200':
          $ref: '#/components/responses/org-updated'
        '400':
          $ref: '#/components/responses/bad-request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/not-found'
        '500':
          $ref: '#/components/responses/server-error'
    delete:
      summary: Delete organisation by ID
      description: Deletes an organisation by its ID.
      operationId: deleteOrganisation
      security:
        - bearerAuth: []
      tags:
        - Organisation
      parameters:
        - $ref: '#/components/parameters/org-id'
      responses:
        '204':
          $ref: '#/components/responses/item-deleted'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/not-found'
        '500':
          $ref: '#/components/responses/server-error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    SignupParam:
      type: object
      properties:
        email:
          type: string
          format: email
          description: The email of the user to signup
        firstName:
          type: string
          format: email
          description: The first name of the user to signup
        lastName:
          type: string
          format: email
          description: The last name the user to signup
        password:
          type: string
          description: The password of the user
        orgName:
          type: string
          description: The name of the organisation the users belong to
        required:
          - email
          - password
          - firstName
          - lastName
          - orgName
    User:
      type: object
      properties:
        id:
          type: string
          example: Q2fspaa93Ad
        firstName:
          type: string
          example: Doug
        lastName:
          type: string
          example: John
        email:
          type: string
          format: email
          example: john.doe@example.com
        role:
          type: string
          example: member
        createdAt:
          type: integer
          format: int64
          example: 1712100000000
          description: Start time of the time track in UNIX milliseconds
        updatedAt:
          type: integer
          format: int64
          example: 1712100000000
          description: Start time of the time track in UNIX milliseconds
    Organisation:
      type: object
      properties:
        id:
          type: string
          example: Os2fe92ja9EA
        name:
          type: string
          example: Visidra
        decription:
          type: string
          description: Optional general description of the organisation.
        email:
          type: string
          format: email
          nullable: false
          description: |
            Optional contact email for the organisation. Used for general communication or administrative purposes.
            example: "contact@visidra.com"
        createdAt:
          type: integer
          format: int64
          example: 1712100000000
          description: Start time of the time track in UNIX milliseconds
        updatedAt:
          type: integer
          format: int64
          example: 1712100000000
          description: Start time of the time track in UNIX milliseconds
    Signup:
      type: object
      properties:
        message:
          type: string
          example: User and organisation registered successfully
          description: Organisation and admin user created successfully
        user:
          $ref: '#/components/schemas/User'
        org:
          $ref: '#/components/schemas/Organisation'
    LoginParam:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: user@visidra.com
        password:
          type: string
          format: password
          example: password123
    Login:
      type: object
      properties:
        accessToken:
          type: string
          example: q224EM8d...
        refreshToken:
          type: string
          example: ia3af99...
        expiresIn:
          type: integer
          format: int64
          example: 1714586400000
    Message:
      type: object
      properties:
        message:
          type: string
          description: Response message
          example: Response message
    RefreshParam:
      type: object
      properties:
        refreshToken:
          type: string
          example: eyJhbGciOi...
      required:
        - refreshToken
    ApiKeyLoginParam:
      type: object
      required:
        - apiKey
      properties:
        apiKey:
          type: string
          format: key
          example: k4t43m1d... (secret)
    Session:
      type: object
      properties:
        id:
          type: string
