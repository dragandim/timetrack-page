  /task/{taskId}/clockout:
    post:
      summary: Clock out using a task ID
      description: Ends time tracking for task ID.
      security:
        - bearerAuth: []
      tags:
        - Task
      parameters:
        - $ref: '#/components/parameters/task-id'
      responses:
        '200':
          $ref: '#/components/responses/timetrack-clockout-200'
        '401':
          $ref: '#/components/responses/unauthorized'
        '500':
