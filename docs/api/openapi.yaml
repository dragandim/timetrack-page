      description: ID of the Project
      schema:
        type: string
    start-date:
      name: startDate
      in: query
      description: |
        Start of the time range (inclusive), in UNIX milliseconds.
        The range between startDate and endDate must not exceed 7 days.
      required: false
      schema:
        type: integer
        example: 1714521600000
    end-date:
      name: endDate
      in: query
