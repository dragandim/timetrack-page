openapi: 3.0.0
info:
  version: 1.0.0
  title: TimeTracks API
  description: |
    TimeTrack API is a headless solution for versatile time tracking
  license:
    name: visidra.com
  contact:
    name: Dragan Dimitrijevic
    url: http://www.visidra.com
    email: dragan@visidra.com
  x-logo:
    url: https://timetracks.visidra.com/api/logo.png
    altText: TimeTracks logo
servers:
  - url: https://timetracks-api.visidra.com/api/v1
    description: Production server
tags:
  - name: Account
    description: |
      Endpoints related to user authentication and account management, including signup, login, token refresh, and invitation-based registration.
  - name: Organisation
    description: |
      Endpoints for creating and managing organisations, including access to organisation details, user membership, and administrative actions.
  - name: User
    description: |
      Endpoints for managing user accounts within an organisation, including listing users, updating user details, and resetting passwords.
  - name: Project
    description: |
      Endpoints for creating and managing projects, which group related tasks and time tracking entries under a shared context.
  - name: Task
    description: |
      Endpoints for managing individual tasks, including creation, time tracking, project assignment, and status management.
  - name: TimeTrack
    description: |
      Endpoints for recording and retrieving time tracking entries for tasks, including clock-in, clock-out, and duration reporting.
  - name: Invitation
    description: |
      Endpoints for managing user invitations, including creating signup links and handling one-time invitation-based account registration. (Optional: may be grouped under Account)
  - name: Report
    description: |
      Endpoints intended for internal use only. Access is restricted to super users with elevated permissions. These operations are not available to regular organisation members.
paths:
  /signup:
    post:
      summary: Signup a new user and organisation
      operationId: signupUser
      tags:
        - Account
      requestBody:
        $ref: '#/components/requestBodies/signup-request'
      responses:
        '201':
          $ref: '#/components/responses/signup-201'
        '400':
          $ref: '#/components/responses/signup-400'
        '409':
          $ref: '#/components/responses/signup-409'
  /login:
    post:
      summary: Login with email and password
      description: |
        Authenticates the user using their email and password credentials. Returns a long-lived access token (valid for 1 day) and a refresh token (valid for 7 days) to enable continuous access without requiring frequent re-authentication. This flow is suitable for interactive user sessions such as web or mobile clients.
      operationId: loginUser
      tags:
        - Account
      requestBody:
        $ref: '#/components/requestBodies/login'
      responses:
        '200':
          $ref: '#/components/responses/login-200'
        '400':
          $ref: '#/components/responses/login-400'
        '401':
          $ref: '#/components/responses/login-401'
  /long/refresh:
    post:
      summary: Rotate long-lived refresh token
      description: |
        Exchanges a valid refresh token for a new access token and refresh token pair. The access token is valid for 1 day, and the refresh token expires 7 days after the session start time. To maintain continuous access, clients must call this endpoint before the refresh token expires.
      operationId: refreshLongSession
      tags:
        - Account
      requestBody:
        $ref: '#/components/requestBodies/refresh'
      responses:
        '200':
          $ref: '#/components/responses/refresh-200'
        '401':
          $ref: '#/components/responses/refresh-401'
  /api-key/login:
    post:
      summary: Login with API key
      description: Logs in a user and returns a short-lived JWT along with a refresh token. Intended for programmatic access such as CLI tools, scripts, or temporary sessions requiring frequent token rotation.
      operationId: tokenLogin
      tags:
        - Account
      requestBody:
        required: true
        $ref: '#/components/requestBodies/api-key-login'
      responses:
        '200':
          $ref: '#/components/responses/login-200'
        '400':
          $ref: '#/components/responses/login-400'
        '401':
          $ref: '#/components/responses/login-401'
  /short/refresh:
    post:
      summary: Rotate short-term refresh token
      description: |
        Exchanges a short-lived refresh token for a new access token and refresh token pair. The access token is valid for 15 minutes, while the refresh token remains valid for 1 day from the session start time. This flow is optimized for automated scripts or background jobs that require frequent token renewal and short-lived access, with security in mind.
      operationId: refreshShortSession
      tags:
        - Account
      requestBody:
        $ref: '#/components/requestBodies/refresh'
      responses:
        '200':
          $ref: '#/components/responses/refresh-200'
        '401':
          $ref: '#/components/responses/refresh-401'
  /sessions:
    get:
      summary: List all active sessions for the organisation
      description: |
        Retrieves all active sessions (access and refresh tokens) created by users within the authenticated organisation. This endpoint is typically used by administrators to monitor or audit user sessions across the entire team. Requires a valid access token with administrative privileges.
      operationId: listSessions
      security:
        - bearerAuth: []
      tags:
        - Account
      responses:
        '200':
          $ref: '#/components/responses/session-list'
        '401':
          $ref: '#/components/responses/session-401'
  /users:
    get:
      summary: Get all users
      operationId: getUsers
      description: Retrieves all users under your organisation
      security:
        - bearerAuth: []
      tags:
        - User
      responses:
        '200':
          $ref: '#/components/responses/user-list'
        '401':
          $ref: '#/components/responses/unauthorized'
        '500':
          $ref: '#/components/responses/server-error'
  /users/count:
    get:
      summary: Get user count
      description: Returns the total number of users in your organisation.
      operationId: getUserCount
      security:
        - bearerAuth: []
      tags:
        - User
      responses:
        '200':
          $ref: '#/components/responses/user-count'
        '401':
          $ref: '#/components/responses/unauthorized'
        '500':
          $ref: '#/components/responses/server-error'
  /users/summary:
    get:
      summary: Get a summary of users
      description: Returns a high-level summary of users in the organization. Supports pagination.
      tags:
        - Summary
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/last-key'
      responses:
        '200':
          $ref: '#/components/responses/users-summary-200'
        '401':
          $ref: '#/components/responses/unauthorized'
        '500':
          $ref: '#/components/responses/server-error'
  /user:
    post:
      summary: Create a new user
      operationId: createUser
      description: Creates a new user entry
      security:
        - bearerAuth: []
      tags:
        - User
      requestBody:
        $ref: '#/components/requestBodies/user-create'
      responses:
        '201':
          $ref: '#/components/responses/user-created'
        '400':
          $ref: '#/components/responses/bad-request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '500':
          $ref: '#/components/responses/server-error'
  /user/{userId}:
    get:
      summary: Get user by ID
      operationId: getUser
      description: Retrieves a user by their ID.
      security:
        - bearerAuth: []
      tags:
        - User
      parameters:
        - $ref: '#/components/parameters/user-id'
      responses:
        '200':
          $ref: '#/components/responses/user'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/not-found'
        '500':
          $ref: '#/components/responses/server-error'
    put:
      summary: Update a user by ID
      operationId: updateUser
      description: Updates a user's details.
      security:
        - bearerAuth: []
      tags:
        - User
      parameters:
        - $ref: '#/components/parameters/user-id'
      requestBody:
        $ref: '#/components/requestBodies/user-update'
      responses:
        '200':
          $ref: '#/components/responses/user-updated'
        '400':
          $ref: '#/components/responses/bad-request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/not-found'
        '500':
          $ref: '#/components/responses/server-error'
    delete:
      summary: Delete a user by ID
      operationId: deleteUser
      description: Deletes a user by their ID.
      security:
        - bearerAuth: []
      tags:
        - User
      parameters:
        - $ref: '#/components/parameters/user-id'
      responses:
        '204':
          $ref: '#/components/responses/item-deleted'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/not-found'
        '500':
          $ref: '#/components/responses/server-error'
  /user/{userId}/password:
    put:
      tags:
        - User
      summary: Update user password
      description: Allows a user to update their own password.
      operationId: updateUserPassword
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/user-id'
      requestBody:
        $ref: '#/components/requestBodies/user-update-password'
      responses:
        '200':
          $ref: '#/components/responses/user-password-updated'
        '400':
          $ref: '#/components/responses/signup-400'
        '403':
          $ref: '#/components/responses/forbidden'
        '500':
          $ref: '#/components/responses/server-error'
  /user/{userId}/password/reset:
    put:
      summary: Reset user password by admin
      description: Allows an admin to reset a user's password.
      operationId: resetUserPasswordByAdmin
      security:
        - bearerAuth: []
      tags:
        - User
      parameters:
        - $ref: '#/components/parameters/user-id'
      requestBody:
        $ref: '#/components/requestBodies/user-reset-password'
      responses:
        '200':
          $ref: '#/components/responses/password-reset-success'
        '400':
          $ref: '#/components/responses/bad-request'
        '403':
          $ref: '#/components/responses/forbidden'
        '500':
          $ref: '#/components/responses/server-error'
  /user/api-keys:
    get:
      summary: Get all API keys
      description: Retrieves all API keys owned by user
      operationId: getAllApiKeys
      security:
        - bearerAuth: []
      tags:
        - User
      responses:
        '200':
          $ref: '#/components/responses/api-key-list'
        '401':
          $ref: '#/components/responses/unauthorized'
        '500':
          $ref: '#/components/responses/server-error'
  /user/api-key:
    post:
      summary: Create a new API key
      description: |
        Generates a new API key for the authenticated user. The plain-text key is returned once in the response and must be stored securely. The response also includes metadata about the key for future reference.
      operationId: createApiKey
      security:
        - bearerAuth: []
      tags:
        - User
      requestBody:
        $ref: '#/components/requestBodies/api-key-create'
      responses:
        '201':
          $ref: '#/components/responses/api-key-created'
        '400':
          $ref: '#/components/responses/bad-request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '500':
          $ref: '#/components/responses/server-error'
  /user/api-key/{apiKeyId}:
    get:
      summary: Get API key by ID
      description: |
        Retrieves metadata for a specific API key, including its name, creation time, last usage timestamp, and masked identifier (last 4 characters).i The actual secret value of the API key is not returned for security reasons.
      operationId: getApiKey
      security:
        - bearerAuth: []
      tags:
        - User
      parameters:
        - $ref: '#/components/parameters/api-key-id'
      responses:
        '200':
          $ref: '#/components/responses/api-key'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/not-found'
        '500':
          $ref: '#/components/responses/server-error'
    put:
      summary: Rotate (renew) an API key
      description: |
        Invalidates the existing API key and generates a new one. The original key is permanently deleted, and a new key is returned in the response. The new key must be stored securely, as it will not be shown again. Useful when rotating credentials for security or automation purposes.
      operationId: renewApiKey
      security:
        - bearerAuth: []
      tags:
        - User
      parameters:
        - $ref: '#/components/parameters/api-key-id'
      responses:
        '200':
          $ref: '#/components/responses/api-key-renewed'
        '400':
          $ref: '#/components/responses/bad-request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/not-found'
        '500':
          $ref: '#/components/responses/server-error'
    delete:
      summary: Delete a API key by ID
      description: |
        Permanently deletes an API key identified by its ID. This action revokes access for any client using the key. Once deleted, the key cannot be recovered.
      operationId: deleteApiKey
      security:
        - bearerAuth: []
      tags:
        - User
      parameters:
        - $ref: '#/components/parameters/api-key-id'
      responses:
        '204':
          $ref: '#/components/responses/item-deleted'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/not-found'
        '500':
          $ref: '#/components/responses/server-error'
  /tasks:
    get:
      summary: Get all tasks
      description: Retrieves all tasks
      operationId: getTasks
      security:
        - bearerAuth: []
      tags:
        - Task
      responses:
        '200':
          $ref: '#/components/responses/task-list'
        '401':
          $ref: '#/components/responses/unauthorized'
        '500':
          $ref: '#/components/responses/server-error'
  /tasks/count:
    get:
      summary: Get task count
      description: Returns the total number of tasks in your organisation.
      operationId: getTaskCount
      security:
        - bearerAuth: []
      tags:
        - Task
      responses:
        '200':
          $ref: '#/components/responses/task-count'
        '401':
          $ref: '#/components/responses/unauthorized'
        '500':
          $ref: '#/components/responses/server-error'
  /tasks/summay:
    get:
      summary: Get a summary of tasks
      description: Returns a high-level summary of tasks in the organization. Supports pagination.
      tags:
        - Summary
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/last-key'
      responses:
        '200':
          $ref: '#/components/responses/tasks-summary-200'
        '401':
          $ref: '#/components/responses/unauthorized'
        '500':
          $ref: '#/components/responses/server-error'
  /task:
    post:
      summary: Create a new task
      operationId: createTask
      description: Creates a new task entry.
      security:
        - bearerAuth: []
      tags:
        - Task
      requestBody:
        $ref: '#/components/requestBodies/task-create'
      responses:
        '201':
          $ref: '#/components/responses/task-created'
        '400':
          $ref: '#/components/responses/bad-request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '500':
          $ref: '#/components/responses/server-error'
  /task/{taskId}:
    get:
      summary: Get task by ID
      description: Retrieves a task by its ID.
      operationId: getTask
      security:
        - bearerAuth: []
      tags:
        - Task
      parameters:
        - $ref: '#/components/parameters/task-id'
      responses:
        '200':
          $ref: '#/components/responses/task'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/not-found'
        '500':
          $ref: '#/components/responses/server-error'
    put:
      summary: Update a task by ID
      description: Updates a task's details
      operationId: updateTask
      security:
        - bearerAuth: []
      tags:
        - Task
      parameters:
        - $ref: '#/components/parameters/task-id'
      requestBody:
        $ref: '#/components/requestBodies/task-update'
      responses:
        '200':
          $ref: '#/components/responses/task-updated'
        '400':
          $ref: '#/components/responses/bad-request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/not-found'
        '500':
          $ref: '#/components/responses/server-error'
    delete:
      summary: Delete a task by ID
      description: Deletes a task by its ID.
      operationId: deleteTask
      security:
        - bearerAuth: []
      tags:
        - Task
      parameters:
        - $ref: '#/components/parameters/task-id'
      responses:
        '204':
          $ref: '#/components/responses/item-deleted'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/not-found'
        '500':
          $ref: '#/components/responses/server-error'
  /projects:
    get:
      summary: Get all projects
      description: Retrieves all projects.
      operationId: getProjects
      security:
        - bearerAuth: []
      tags:
        - Project
      responses:
        '200':
          $ref: '#/components/responses/project-list'
        '401':
          $ref: '#/components/responses/unauthorized'
        '500':
          $ref: '#/components/responses/server-error'
  /projects/count:
    get:
      summary: Get project count
      description: Returns the total number of projects in your organisation.
      operationId: getProjectCount
      security:
        - bearerAuth: []
      tags:
        - Project
      responses:
        '200':
          $ref: '#/components/responses/project-count'
        '401':
          $ref: '#/components/responses/unauthorized'
        '500':
          $ref: '#/components/responses/server-error'
  /projects/summary:
    get:
      summary: Get a summary of projects
      description: Returns a high-level summary of projects in the organization. Supports pagination.
      tags:
        - Summary
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/last-key'
      responses:
        '200':
          $ref: '#/components/responses/projects-summary-200'
        '401':
          $ref: '#/components/responses/unauthorized'
        '500':
          $ref: '#/components/responses/server-error'
  /project:
    post:
      summary: Create a new project
      operationId: createProject
      description: Creates a new project entry.
      security:
        - bearerAuth: []
      tags:
        - Project
      requestBody:
        $ref: '#/components/requestBodies/project-create'
      responses:
        '201':
          $ref: '#/components/responses/project-created'
        '400':
          $ref: '#/components/responses/bad-request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '500':
          $ref: '#/components/responses/server-error'
  /project{projectId}:
    get:
      summary: Get project by ID
      description: Retrieves a project by its ID.
      operationId: getProject
      security:
        - bearerAuth: []
      tags:
        - Project
      parameters:
        - $ref: '#/components/parameters/project-id'
      responses:
        '200':
          $ref: '#/components/responses/project'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/not-found'
        '500':
          $ref: '#/components/responses/server-error'
    put:
      summary: Update a project
      description: Updates a project's details.
      operationId: updateProject
      security:
        - bearerAuth: []
      tags:
        - Project
      parameters:
        - $ref: '#/components/parameters/project-id'
      requestBody:
        $ref: '#/components/requestBodies/project-update'
      responses:
        '200':
          $ref: '#/components/responses/project-updated'
        '400':
          $ref: '#/components/responses/bad-request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/not-found'
        '500':
          $ref: '#/components/responses/server-error'
    delete:
      summary: Delete a project
      description: Deletes a project by its ID
      operationId: deleteProject
      security:
        - bearerAuth: []
      tags:
        - Project
      parameters:
        - $ref: '#/components/parameters/project-id'
      responses:
        '204':
          $ref: '#/components/responses/item-deleted'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/not-found'
        '500':
          $ref: '#/components/responses/server-error'
  /project{projectId}/tasks:
    get:
      summary: Get all tasks by project ID
      description: Retrieve all tasks associated with a specific project.
      operationId: getProjectTasks
      security:
        - bearerAuth: []
      tags:
        - Project
      parameters:
        - $ref: '#/components/parameters/project-id'
      responses:
        '200':
          $ref: '#/components/responses/task-list'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/not-found'
        '500':
          $ref: '#/components/responses/server-error'
  /project{projectId}/task:
    post:
      summary: Create a new task to a specific project.
      description: Adds a new task and assigns it to the specified project by project ID.
      operationId: addTaskToProject
      security:
        - bearerAuth: []
      tags:
        - Project
      parameters:
        - $ref: '#/components/parameters/project-id'
      requestBody:
        $ref: '#/components/requestBodies/task-create'
      responses:
        '201':
          $ref: '#/components/responses/task-created'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/not-found'
        '500':
          $ref: '#/components/responses/server-error'
  /project/{projectId}/task/{taskId}/move:
    post:
      summary: Move a task to another project
      description: |
        Updates the task's project association by assigning it to a different project.
        This operation is useful for reorganizing tasks across projects without modifying the task content.
      operationId: moveTaskToProject
      security:
        - bearerAuth: []
      tags:
        - Project
      parameters:
        - $ref: '#/components/parameters/project-id'
        - $ref: '#/components/parameters/task-id'
      requestBody:
        $ref: '#/components/requestBodies/project-move-task'
      responses:
        '200':
          $ref: '#/components/responses/task-updated'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/not-found'
        '500':
          $ref: '#/components/responses/server-error'
  /project/{projectId}/task/{taskId}:
    delete:
      summary: Remove task from project
      description: |
        Permanently deletes a task from the specified project.
        This operation cannot be undone and will remove the task and its time tracking data entirely.
      operationId: removeTaskFromProject
      security:
        - bearerAuth: []
      tags:
        - Project
      parameters:
        - $ref: '#/components/parameters/project-id'
        - $ref: '#/components/parameters/task-id'
      responses:
        '204':
          $ref: '#/components/responses/item-deleted'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/not-found'
        '500':
          $ref: '#/components/responses/server-error'
  /project/{projectId}/task/{taskId}/detach:
    post:
      summary: Detach task from a project
      description: |
        Removes the association between the task and its project, but keeps the task and its data intact.
      operationId: detachTaskFromProject
      security:
        - bearerAuth: []
      tags:
        - Project
      parameters:
        - $ref: '#/components/parameters/project-id'
        - $ref: '#/components/parameters/task-id'
      responses:
        '200':
          $ref: '#/components/responses/task-updated'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/not-found'
        '500':
          $ref: '#/components/responses/server-error'
  /project/{projectId}/task/{taskId}/attach:
    post:
      summary: Attach an existing task to a project
      description: |
        Associates an existing standalone task with the specified project.
        This operation updates the task's project reference without modifying other task data.
      operationId: attachTaskToProject
      security:
        - bearerAuth: []
      tags:
        - Project
      parameters:
        - $ref: '#/components/parameters/project-id'
        - $ref: '#/components/parameters/task-id'
      responses:
        '200':
          $ref: '#/components/responses/task-updated'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/not-found'
        '500':
          $ref: '#/components/responses/server-error'
  /report/task/{taskId}:
    get:
      summary: Get task report for total tracked time
      description: |
        Retrieves a detailed time tracking report for a specific task, including total tracked time, and related time entries.
      operationId: getTaskTimeTrackReport
      security:
        - bearerAuth: []
      tags:
        - Report
      parameters:
        - $ref: '#/components/parameters/task-id'
      responses:
        '200':
          $ref: '#/components/responses/report-task-timetrack'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/not-found'
        '500':
          $ref: '#/components/responses/server-error'
  /report/task/{taskId}/user-breakdown:
    get:
      summary: Get task report with user breakdown
      description: |
        Retrieves a detailed time tracking report for a specific task, including total tracked time, user-by-user breakdown, and related time entries.
      operationId: getTaskUserReport
      security:
        - bearerAuth: []
      tags:
        - Report
      parameters:
        - $ref: '#/components/parameters/task-id'
      responses:
        '200':
          $ref: '#/components/responses/report-task-user-breakdown'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/not-found'
        '500':
          $ref: '#/components/responses/server-error'
  /report/project/{projectId}/user-breakdown:
    get:
      summary: Get project report user breakdown
      description: |
        Retrieves a time tracking report for a specific project, including a breakdown of total time tracked by each user across all associated tasks.
      operationId: getProjectUserBreakdownReport
      security:
        - bearerAuth: []
      tags:
        - Report
      parameters:
        - $ref: '#/components/parameters/project-id'
      responses:
        '200':
          $ref: '#/components/responses/report-project-user-breakdown'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/not-found'
        '500':
          $ref: '#/components/responses/server-error'
  /report/project/{projectId}/task-breakdown:
    get:
      summary: Get project report with task breakdown
      description: |
        Retrieves a time tracking report for a specific project, including a breakdown of total time tracked for each task within the project. Useful for understanding how time is distributed across tasks regardless of user.
      operationId: getProjectTaskBreakdownReport
      security:
        - bearerAuth: []
      tags:
        - Report
      parameters:
        - $ref: '#/components/parameters/project-id'
      responses:
        '200':
          $ref: '#/components/responses/report-project-task-breakdown'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/not-found'
        '500':
          $ref: '#/components/responses/server-error'
  /report/user/{userId}/project:
    get:
      summary: Get user report with project breakdown
      description: |
        Retrieves a time tracking report for a specific user, including a project-level breakdown with all associated tasks and time tracked within each. Useful for reviewing a user's activity across multiple projects over a given time range.
      operationId: getUserReport
      security:
        - bearerAuth: []
      tags:
        - Report
      parameters:
        - $ref: '#/components/parameters/user-id'
        - $ref: '#/components/parameters/start-date'
        - $ref: '#/components/parameters/end-date'
      responses:
        '200':
          $ref: '#/components/responses/report-user-project-breakdown'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/not-found'
        '500':
          $ref: '#/components/responses/server-error'
  /task/{taskId}/clockin:
    post:
      summary: Clock in using a task ID
      description: Starts time tracking for task ID
      tags:
        - Task
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/task-id'
      responses:
        '200':
          $ref: '#/components/responses/timetrack-clockin-response'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/not-found'
        '500':
          $ref: '#/components/responses/server-error'
  /task/{taskId}/clockout:
    post:
      summary: Clock out using a task ID
      description: Ends time tracking for task ID.
      security:
        - bearerAuth: []
      tags:
        - Task
      parameters:
        - $ref: '#/components/parameters/task-id'
      responses:
        '200':
          $ref: '#/components/responses/timetrack-clockout-response'
        '401':
          $ref: '#/components/responses/unauthorized'
        '500':
          $ref: '#/components/responses/server-error'
  /task/clockin/by-name/{name}:
    post:
      summary: Clock in using task name
      description: Starts time tracking using task name. If tasks does not exist, it gets created first
      security:
        - bearerAuth: []
      tags:
        - Task
      parameters:
        - $ref: '#/components/parameters/task-name'
      responses:
        '200':
          $ref: '#/components/responses/timetrack-clockin-name-response'
        '401':
          $ref: '#/components/responses/unauthorized'
        '500':
          $ref: '#/components/responses/server-error'
  /task/clockin/by-external-id/{externalId}:
    post:
      summary: Clock in using external ID
      description: Starts time tracking using external ID. This ID typically comes from an integrated third-party project management system such as Jira, Trello, Asana, or GitHub. If tasks does not exists, it gets created first
      security:
        - bearerAuth: []
      tags:
        - Task
      parameters:
        - $ref: '#/components/parameters/task-externalid'
      responses:
        '200':
          $ref: '#/components/responses/timetrack-clockin-externalid-response'
        '401':
          $ref: '#/components/responses/unauthorized'
        '500':
          $ref: '#/components/responses/server-error'
  /task/{taskId}/tracks:
    get:
      summary: Get all time tracks under task ID
      description: |
        Retrieves all time tracking entries associated with the specified task.
        Useful for reporting, auditing, or displaying time spent on a specific task.
      operationId: getTracks
      security:
        - bearerAuth: []
      tags:
        - TimeTrack
      responses:
        '200':
          $ref: '#/components/responses/timetrack-list'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/not-found'
        '500':
          $ref: '#/components/responses/server-error'
  /task/{taskId}/track:
    post:
      summary: Create a new time track under task ID
      description: |
        Starts a new time tracking entry for the specified task.
        Records the start time and, optionally, the end time if provided.
      operationId: createTimeTrack
      security:
        - bearerAuth: []
      tags:
        - TimeTrack
      requestBody:
        $ref: '#/components/requestBodies/timetrack-create'
      responses:
        '201':
          $ref: '#/components/responses/timetrack-created'
        '400':
          $ref: '#/components/responses/bad-request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/not-found'
        '500':
          $ref: '#/components/responses/server-error'
  /task/{taskId}track/{trackId}:
    get:
      summary: Get a time track under task ID
      description: |
        Retrieves a specific time tracking entry associated with the given task ID and time track ID.
        Useful for viewing detailed time tracking information for a single entry.
      operationId: getTimeTrack
      security:
        - bearerAuth: []
      tags:
        - TimeTrack
      parameters:
        - $ref: '#/components/parameters/task-id'
        - $ref: '#/components/parameters/timetrack-id'
      responses:
        '200':
          $ref: '#/components/responses/timetrack-get'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/not-found'
        '500':
          $ref: '#/components/responses/server-error'
    put:
      summary: Update a time track under task ID
      description: |
        Modifies an existing time tracking entry associated with the specified task.
        Typically used to set or adjust the end time, duration, or correct tracking errors.
      operationId: updateTimeTrack
      security:
        - bearerAuth: []
      tags:
        - TimeTrack
      parameters:
        - $ref: '#/components/parameters/task-id'
        - $ref: '#/components/parameters/timetrack-id'
      responses:
        '200':
          $ref: '#/components/responses/timetrack-get'
        '404':
          description: TimeTrack not found
    delete:
      summary: Delete a time track under task ID
      description: |
        Permanently removes a specific time tracking entry associated with the given task.
        This action cannot be und
      operationId: deleteTimeTrack
      security:
        - bearerAuth: []
      tags:
        - TimeTrack
      parameters:
        - $ref: '#/components/parameters/task-id'
        - $ref: '#/components/parameters/timetrack-id'
      responses:
        '204':
          $ref: '#/components/responses/item-deleted'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/not-found'
        '500':
          $ref: '#/components/responses/server-error'
  /timetracks/count:
    get:
      summary: Get time track count
      description: Returns the total number of time tracks in your organisation.
      operationId: getTimeTrackCount
      security:
        - bearerAuth: []
      tags:
        - TimeTrack
      responses:
        '200':
          $ref: '#/components/responses/timetrack-count'
        '401':
          $ref: '#/components/responses/unauthorized'
        '500':
          $ref: '#/components/responses/server-error'
  /invitations:
    get:
      summary: Get all invitations
      description: Retrieves all invitations under your organisation
      operationId: getInvitations
      security:
        - bearerAuth: []
      tags:
        - Invitation
      responses:
        '200':
          $ref: '#/components/responses/invitation-list'
        '401':
          $ref: '#/components/responses/unauthorized'
        '500':
          $ref: '#/components/responses/server-error'
  /invitations/count:
    get:
      summary: Get invitation count
      description: Returns the total number of invitations in your organisation.
      operationId: getInvitationCount
      security:
        - bearerAuth: []
      tags:
        - Invitation
      responses:
        '200':
          $ref: '#/components/responses/invitation-count'
        '401':
          $ref: '#/components/responses/unauthorized'
        '500':
          $ref: '#/components/responses/server-error'
  /invitation:
    post:
      summary: Create a new invitation for user signup
      description: |
        Creates a new invitation for a user to join the organisation.
        The invitation includes a one-time signup link that expires after 1 day.
      operationId: createInvitation
      security:
        - bearerAuth: []
      tags:
        - Invitation
      requestBody:
        $ref: '#/components/requestBodies/invitation-create'
      responses:
        '201':
          $ref: '#/components/responses/invitation-created'
        '400':
          $ref: '#/components/responses/bad-request'
        '500':
          $ref: '#/components/responses/server-error'
  /invitation/{invId}:
    get:
      summary: Get an invitation by ID
      description: |
        Retrieves an invitation by its ID, including the email and expiration details.
        Typically used to validate and display invitation information before signup.
      operationId: getInvitation
      security:
        - bearerAuth: []
      tags:
        - Invitation
      parameters:
        - $ref: '#/components/parameters/invitation-id'
      responses:
        '200':
          $ref: '#/components/responses/invitation'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/not-found'
        '500':
          $ref: '#/components/responses/server-error'
    delete:
      summary: Delete an invitation
      description: |
        Deletes a pending invitation by its ID. This operation is typically used to revoke access before the invitation is accepted. Only valid for invitations that have not yet been used or expired.
      tags:
        - Invitation
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/invitation-id'
      responses:
        '204':
          $ref: '#/components/responses/item-deleted'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/not-found'
        '500':
          $ref: '#/components/responses/server-error'
  /invitation/{invId}/signup:
    post:
      summary: Signup a user using an invitation
      description: |
        Completes the signup process for an invited user using a one-time invitation link.
        Creates the user account and removes the invitation if it is valid and not expired.
      operationId: signupInvitation
      security:
        - bearerAuth: []
      tags:
        - Account
      requestBody:
        $ref: '#/components/requestBodies/user-create'
      responses:
        '201':
          $ref: '#/components/responses/user-created'
        '404':
          $ref: '#/components/responses/not-found'
        '500':
          $ref: '#/components/responses/server-error'
  /org/{orgId}:
    get:
      summary: Get organisation by ID
      description: Retrieves an organisation by its ID.
      operationId: getOrganisation
      security:
        - bearerAuth: []
      tags:
        - Organisation
      parameters:
        - $ref: '#/components/parameters/org-id'
      responses:
        '200':
          $ref: '#/components/responses/org'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/not-found'
        '500':
          $ref: '#/components/responses/server-error'
    put:
      summary: Update organisation by ID
      operationId: updateOrganisation
      description: Updates an organisation's details.
      security:
        - bearerAuth: []
      tags:
        - Organisation
      parameters:
        - $ref: '#/components/parameters/org-id'
      requestBody:
        $ref: '#/components/requestBodies/org-update'
      responses:
        '200':
          $ref: '#/components/responses/org-updated'
        '400':
          $ref: '#/components/responses/bad-request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/not-found'
        '500':
          $ref: '#/components/responses/server-error'
    delete:
      summary: Delete organisation by ID
      description: Deletes an organisation by its ID.
      operationId: deleteOrganisation
      security:
        - bearerAuth: []
      tags:
        - Organisation
      parameters:
        - $ref: '#/components/parameters/org-id'
      responses:
        '204':
          $ref: '#/components/responses/item-deleted'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/not-found'
        '500':
          $ref: '#/components/responses/server-error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  requestBodies:
    signup-request:
      description: Signup required field
      content:
        application/json:
          schema:
            type: object
            properties:
              email:
                type: string
                format: email
                description: The email of the user to signup
              firstName:
                type: string
                format: email
                description: The first name of the user to signup
              lastName:
                type: string
                format: email
                description: The last name the user to signup
              password:
                type: string
                description: The password of the user
              orgName:
                type: string
                description: The name of the organisation the users belong to
            required:
              - email
              - password
              - firstName
              - lastName
              - orgName
    login:
      description: Login credentials (email and password)
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/login-credentials'
    refresh:
      description: Refresh token
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/refresh'
    api-key-login:
      description: Login with API key
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/api-key-credentials'
    user-create:
      description: User object that needs to be created
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/user-create'
    user-update:
      description: User object that needs to be updated
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/user-update'
    user-update-password:
      description: Object that updates password
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/user-update-password'
    user-reset-password:
      content:
        application/json:
          schema:
            type: object
            required:
              - expiresAt
            properties:
              expiresAt:
                type: string
                format: date-time
                description: The new expiration date in ISO_8601 format.
                example: '2025-04-30T00:00:00Z'
    api-key-create:
      description: Name for the new API key
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/api-key-create'
    task-create:
      description: Task object that needs to be created
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/task-create'
    task-update:
      description: Task object that needs to be updated
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/task-update'
    project-create:
      description: Project object that needs to be created
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - name
            properties:
              name:
                type: string
                example: New e-commerce shop
              description:
                type: string
                example: Few months with NestJS and Vue
              externalId:
                type: string
                example: JIRA-102
    project-update:
      description: Project object that needs to be updated
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/project-update'
    project-move-task:
      description: Object containing task move information
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - projectId
            properties:
              projectId:
                type: string
                example: I9a2f9f13Aq
    timetrack-create:
      description: Create a new time track entry
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              start:
                type: integer
                format: int64
                description: Unix timestamp in milliseconds (UTC)
              end:
                type: integer
                format: int64
                description: Unix timestamp in milliseconds (UTC)
            required:
              - start
    invitation-create:
      description: Invitation object that needs to be created
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - email
            properties:
              email:
                type: string
                format: email
                description: The email of the user being invited.
                example: john.doe@example.com
    org-update:
      description: Organisation object that needs to be updated
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/org-update'
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          example: Q2fspaa93Ad
        firstName:
          type: string
          example: Doug
        lastName:
          type: string
          example: John
        email:
          type: string
          format: email
          example: john.doe@example.com
        role:
          type: string
          example: member
        createdAt:
          type: string
          format: date-time
          example: '2025-04-22T10:00:00Z'
        updatedAt:
          type: string
          format: date-time
          example: '2025-04-22T10:00:00Z'
    org:
      type: object
      properties:
        id:
          type: string
          example: Os2fe92ja9EA
        name:
          type: string
          example: Visidra
        decription:
          type: string
          description: Optional general description of the organisation.
        email:
          type: string
          format: email
          nullable: false
          description: |
            Optional contact email for the organisation. Used for general communication or administrative purposes.
          example: contact@visidra.com
        createdAt:
          type: string
          format: date-time
          example: '2025-04-22T10:00:00Z'
        updatedAt:
          type: string
          format: date-time
          example: '2025-04-22T10:00:00Z'
    login-credentials:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: user@visidra.com
        password:
          type: string
          format: password
          example: password123
    login:
      type: object
      properties:
        accessToken:
          type: string
          example: q224EM8d...
        refreshToken:
          type: string
          example: ia3af99...
        expiresIn:
          type: integer
          format: int64
          example: 1714586400000
    message:
      type: object
      properties:
        message:
          type: string
          description: Response message
          example: Response message
    refresh:
      type: object
      properties:
        refreshToken:
          type: string
          example: eyJhbGciOi...
          required:
            - refreshToken
    api-key-credentials:
      type: object
      required:
        - apiKey
      properties:
        apiKey:
          type: string
          format: key
          example: k4t43m1d... (secret)
    session:
      type: object
      properties:
        id:
          type: string
          example: 9vjaæ38f9w
        userId:
          type: string
          example: 9vjaæ38f9w
        sessionStartedAt:
          type: integer
          format: int64
          example: 1714500000000
        expiresAt:
          type: integer
          format: int64
          example: 1714586400000
        userAgent:
          type: string
          example: Mozilla/5.0
    user:
      type: object
      properties:
        id:
          type: string
          example: Q2fspaa93Ad
        firstName:
          type: string
          example: Doug
        lastName:
          type: string
          example: John
        email:
          type: string
          format: email
          example: john.doe@example.com
        role:
          type: string
          example: member
        createdAt:
          type: string
          format: date-time
          example: '2025-04-22T10:00:00Z'
        updatedAt:
          type: string
          format: date-time
          example: '2025-04-22T10:00:00Z'
    item-count:
      type: object
      properties:
        count:
          type: integer
          example: 29
    user-summary:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        total:
          type: integer
          description: Total time tracked by the user in milliseconds
        totalFormatted:
          type: string
          example: 1h 35m 5s
          description: Human-readable version of the tracked duration, derived from the total field.
        lastSessionAt:
          type: string
          format: date-time
          example: '2025-04-22T15:30:00Z'
          description: Time and date in ISO 8601 format
        projectsInvolved:
          type: integer
          description: Number of projects the user has contributed to
      required:
        - id
        - email
        - firstName
        - lastName
        - total
        - totalFormatted
        - lastSessionAt
        - projectsInvolved
    summary-user-list:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/user-summary'
        lastKey:
          type: string
          nullable: true
          description: Token to fetch the next page of results
      required:
        - items
    user-create:
      type: object
      required:
        - username
        - email
        - password
        - role
      properties:
        firstName:
          type: string
          example: John
        lastName:
          type: string
          example: Doe
        email:
          type: string
          format: email
          example: john.doe@example.com
        role:
          type: string
          enum:
            - member
            - admin
          example: member
          description: The user's role within the organization.
    user-update:
      type: object
      properties:
        firstName:
          type: string
          example: Doug
        lastName:
          type: string
          example: John
        email:
          type: string
          format: email
          example: john.doe@example.com
